name: CI
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          pytest -q app/tests

      - name: Build Docker image
        run: docker build -t ${{ github.repository }}:${{ github.run_number }} .

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ github.repository }}:${{ github.run_number }} ${{ secrets.DOCKERHUB_USERNAME }}/ci-demo:${{ github.run_number }}
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/ci-demo:${{ github.run_number }} ${{ secrets.DOCKERHUB_USERNAME }}/ci-demo:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ci-demo:${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ci-demo:latest
